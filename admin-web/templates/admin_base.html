<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172554">
    <title>{% block title %}Chez Bob Admin{% endblock %}</title>
    <link rel="stylesheet" href="/admin.css?v=17">
    {% block head %}{% endblock %}
  </head>
  <body>
    {% set active_section = request.path.split("/")[1] %}
    <div class="admin-shell">
      <aside class="sidebar" id="sidebar">
        <a class="admin-brand" href="/dashboard" aria-label="Chez Bob admin home">
          <img class="brand-mark" src="/chezbob-logo.png" alt="">
          <span><strong>Chez Bob</strong><small>Administration</small></span>
        </a>
        <nav aria-label="Admin navigation">
          <a href="/dashboard" data-route="dashboard"{% if active_section == "dashboard" %} class="active" aria-current="page"{% endif %}><span>⌂</span>Dashboard</a>
          <a href="/transactions" data-route="transactions"{% if active_section == "transactions" %} class="active" aria-current="page"{% endif %}><span>↔</span>Transactions</a>
          <a href="/debt" data-route="debt"{% if active_section == "debt" %} class="active" aria-current="page"{% endif %}><span>↓</span>Wall of Shame</a>
          <a href="/inventory" data-route="inventory"{% if active_section == "inventory" %} class="active" aria-current="page"{% endif %}><span>▦</span>Inventory</a>
          <a href="/item-scanner" data-route="item-scanner"{% if active_section == "item-scanner" %} class="active" aria-current="page"{% endif %}><span>▣</span>Item scanner</a>
          <a href="/volunteers" data-route="volunteers"{% if active_section == "volunteers" %} class="active" aria-current="page"{% endif %}><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"></circle><path d="M5.5 20v-2.5a6.5 6.5 0 0 1 13 0V20"></path></svg></span>Volunteers</a>
          <a href="/users" data-route="users"{% if active_section == "users" %} class="active" aria-current="page"{% endif %}><span>◎</span>Users</a>
          <a href="/logs" data-route="logs"{% if active_section == "logs" %} class="active" aria-current="page"{% endif %}><span>≡</span>Logs</a>
        </nav>
      </aside>
      <div class="admin-content">
        <button class="menu-button" id="menu-button" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
        <main id="admin-main" tabindex="-1">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
    <script src="/navigation.js?v=1" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
